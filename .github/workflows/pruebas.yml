name: Pruebas unitarias e integración PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joyas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
            PGPORT: 5432
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: joyas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar sintaxis
        run: find . -path './node_modules' -prune -o -name '*.js' -print -exec node --check {} \;
      - name: Pruebas automatizadas
        run: npm test
